<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img">
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#334155"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#2563eb"/></marker>
<filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".12"/></filter>
<style>text{font-family:Arial,sans-serif;fill:#0f172a}.h{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#475569}.phase{font-size:18px;font-weight:700;fill:#fff}.n{font-size:16px;font-weight:700}.c{font-size:13px;fill:#475569}.sm{font-size:12px;fill:#64748b}.num{font-size:13px;font-weight:700;fill:#fff}.p{fill:#fff;stroke:#dbeafe;stroke-width:2}.person{fill:#f0fdf4;stroke:#4ade80;stroke-width:1.5;filter:url(#s)}.aws{fill:#fff7ed;stroke:#fb923c;stroke-width:1.5;filter:url(#s)}.data{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5;filter:url(#s)}.f{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#a)}.d{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#b)}</style>
</defs>
<rect width="1400" height="820" fill="#f8fafc"/>
<text x="60" y="52" class="h">Jobcard lifecycle</text>
<text x="60" y="80" class="sub">The PDF is created when the job closes. Downloading only retrieves the existing S3 file.</text>
<rect x="40" y="110" width="1320" height="330" rx="18" class="p"/><path d="M58 110H1342Q1360 110 1360 128V156H40V128Q40 110 58 110Z" fill="#1d4ed8"/>
<text x="65" y="141" class="phase">A. Creation path - technician closes the job</text>
<g transform="translate(70 205)"><rect width="190" height="120" rx="12" class="person"/><circle cx="25" cy="25" r="15" fill="#16a34a"/><text x="25" y="30" text-anchor="middle" class="num">1</text><text x="50" y="31" class="n">Technician</text><text x="20" y="65" class="c">Closes the job in the</text><text x="20" y="86" class="c">frontend with status</text><text x="20" y="108" class="n">complete</text></g>
<path d="M260 265H315" class="f"/><text x="287" y="247" text-anchor="middle" class="sm">POST</text>
<g transform="translate(315 205)"><rect width="190" height="120" rx="12" class="aws"/><circle cx="25" cy="25" r="15" fill="#f97316"/><text x="25" y="30" text-anchor="middle" class="num">2</text><text x="50" y="31" class="n">API Gateway</text><text x="20" y="67" class="c">Invokes Lambda:</text><text x="20" y="90" class="n">postJobAction</text></g>
<path d="M505 265H560" class="f"/>
<g transform="translate(560 185)"><rect width="240" height="160" rx="12" class="data"/><circle cx="25" cy="25" r="15" fill="#2563eb"/><text x="25" y="30" text-anchor="middle" class="num">3</text><text x="50" y="31" class="n">DynamoDB</text><text x="20" y="67" class="n">Action table</text><text x="20" y="88" class="c">Completed work details</text><line x1="20" y1="105" x2="220" y2="105" stroke="#bfdbfe"/><text x="20" y="130" class="n">Request table</text><text x="20" y="151" class="c">status=complete + action_id</text></g>
<path d="M800 265H860" class="f"/><text x="830" y="235" text-anchor="middle" class="sm">DynamoDB</text><text x="830" y="250" text-anchor="middle" class="sm">Stream</text>
<g transform="translate(860 205)"><rect width="205" height="120" rx="12" class="aws"/><circle cx="25" cy="25" r="15" fill="#f97316"/><text x="25" y="30" text-anchor="middle" class="num">4</text><text x="50" y="31" class="n">PDF Lambda</text><text x="20" y="66" class="c">ECR container merges</text><text x="20" y="87" class="c">request + action data</text><text x="20" y="108" class="n">Creates PDF</text></g>
<path d="M1065 265H1125" class="f"/>
<g transform="translate(1125 205)"><rect width="195" height="120" rx="12" class="data"/><circle cx="25" cy="25" r="15" fill="#2563eb"/><text x="25" y="30" text-anchor="middle" class="num">5</text><text x="50" y="31" class="n">Amazon S3</text><text x="20" y="67" class="c">Stores:</text><text x="20" y="89" class="n">jobcards/</text><text x="20" y="109" class="c">{request_id}.pdf</text></g>
<rect x="560" y="370" width="505" height="46" rx="10" fill="#fff7ed" stroke="#fdba74"/><text x="580" y="398" class="c">Required order: save the action before the complete-status stream event is processed.</text>
<rect x="40" y="475" width="1320" height="290" rx="18" class="p"/><path d="M58 475H1342Q1360 475 1360 493V521H40V493Q40 475 58 475Z" fill="#0369a1"/>
<text x="65" y="506" class="phase">B. Download path - user requests the existing jobcard</text>
<g transform="translate(70 585)"><rect width="190" height="120" rx="12" class="person"/><circle cx="25" cy="25" r="15" fill="#16a34a"/><text x="25" y="30" text-anchor="middle" class="num">6</text><text x="50" y="31" class="n">User / frontend</text><text x="20" y="67" class="c">Selects</text><text x="20" y="89" class="n">Download jobcard</text></g>
<path d="M260 645H315" class="d"/><text x="287" y="627" text-anchor="middle" class="sm">GET</text>
<g transform="translate(315 585)"><rect width="220" height="120" rx="12" class="aws"/><circle cx="25" cy="25" r="15" fill="#f97316"/><text x="25" y="30" text-anchor="middle" class="num">7</text><text x="50" y="31" class="n">API Gateway</text><text x="20" y="65" class="c">/jobs/{actionId}/jobcard</text><text x="20" y="88" class="n">getJobcardById</text><text x="20" y="108" class="c">Lambda</text></g>
<path d="M535 645H590" class="d"/>
<g transform="translate(590 585)"><rect width="230" height="120" rx="12" class="data"/><circle cx="25" cy="25" r="15" fill="#2563eb"/><text x="25" y="30" text-anchor="middle" class="num">8</text><text x="50" y="31" class="n">Request table</text><text x="20" y="67" class="c">ActionIdIndex resolves:</text><text x="20" y="89" class="n">action_id -&gt; request_id</text><text x="20" y="109" class="c">+ jobcardNumber</text></g>
<path d="M820 645H880" class="d"/>
<g transform="translate(880 585)"><rect width="205" height="120" rx="12" class="data"/><circle cx="25" cy="25" r="15" fill="#2563eb"/><text x="25" y="30" text-anchor="middle" class="num">9</text><text x="50" y="31" class="n">Amazon S3</text><text x="20" y="67" class="c">Checks PDF exists and</text><text x="20" y="89" class="c">returns a 10-minute</text><text x="20" y="109" class="n">presigned URL</text></g>
<path d="M1085 645H1145" class="d"/>
<g transform="translate(1145 585)"><rect width="175" height="120" rx="12" class="person"/><circle cx="25" cy="25" r="15" fill="#16a34a"/><text x="25" y="30" text-anchor="middle" class="num">10</text><text x="50" y="31" class="n">Browser</text><text x="20" y="67" class="c">Downloads</text><text x="20" y="89" class="n">jobcardNumber.pdf</text></g>
<text x="60" y="795" class="sm">Note: the download request does not invoke the PDF Lambda.</text>
</svg>
