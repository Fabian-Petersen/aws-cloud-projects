components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Resource identifier; maintenance and generated-resource IDs are string UUIDs.
      schema: { type: string }
    StatusQuery:
      name: status
      in: query
      required: false
      description: May be supplied more than once as status[] where supported by the list handler.
      schema: { type: string }
    LocationQuery:
      name: location
      in: query
      required: true
      schema: { type: string }
    LocationQueryOptional:
      name: location
      in: query
      required: false
      description: Admin and maintenance callers may select a location or all locations; manager and user callers are restricted to their token location.
      schema: { type: string }
    YearQuery:
      name: year
      in: query
      required: false
      schema: { type: integer, minimum: 2000 }
    MonthQuery:
      name: month
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 12 }

  responses:
    Success:
      description: Operation succeeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MessageResponse" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    FreeformObject:
      type: object
      additionalProperties: true

    MessageResponse:
      type: object
      additionalProperties: true
      properties:
        message: { type: string }

    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        error: { type: string }
        message: { type: string }

    UploadMetadata:
      type: object
      required: [filename, content_type]
      properties:
        filename: { type: string, example: motor-photo.jpg }
        content_type: { type: string, example: image/jpeg }

    PresignedUpload:
      type: object
      additionalProperties: true
      properties:
        filename: { type: string }
        content_type: { type: string }
        key: { type: string }
        url: { type: string, format: uri }
        upload_url: { type: string, format: uri }

    RequestAsset:
      type: object
      required: [area, equipment]
      properties:
        assetID: { type: string }
        area: { type: string }
        equipment: { type: string }
        assetIssueReason:
          type: string
          enum: [no barcode visible, barcode damaged, rental unit, other]
        images:
          type: array
          items: { $ref: "#/components/schemas/UploadMetadata" }
      description: Either assetID or assetIssueReason is required by the handler.

    MaintenanceRequestCreate:
      type: object
      required: [location, type, priority, impact, description, breakdown_time, assets]
      properties:
        location: { type: string }
        type: { type: string }
        priority: { type: string }
        impact: { type: string }
        jobComments: { type: string, description: Included when supplied by the client. }
        description: { type: string }
        breakdown_time: { type: string, format: date-time }
        assets:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RequestAsset" }

    MaintenanceRequest:
      allOf:
        - $ref: "#/components/schemas/MaintenanceRequestCreate"
        - type: object
          additionalProperties: true
          properties:
            id: { type: string }
            status: { type: string }
            created_at: { type: string, format: date-time }
            created_by_sub: { type: string }
            assign_to_sub: { type: string }
            assign_to_name: { type: string }
            assign_to_group: { type: string }
            targetDate: { type: string }

    JobApproval:
      type: object
      required: [targetDate, status, selectedRowId, assign_to_name, assign_to_sub, assign_to_group]
      properties:
        targetDate: { type: string }
        status: { type: string }
        selectedRowId: { type: string }
        assign_to_name: { type: string }
        assign_to_sub: { type: string }
        assign_to_group: { type: string }

    JobRejection:
      type: object
      required: [reject_message, status, selectedRowId]
      properties:
        reject_message: { type: string }
        status: { type: string }
        selectedRowId: { type: string }

    CostLine:
      type: object
      additionalProperties: true
      properties:
        description: { type: string }
        quantity: { type: number }
        cost: { type: number, format: double }
        total: { type: number, format: double }

    MaintenanceActionCreate:
      type: object
      required: [start_time, end_time, total_km, work_completed, status, root_cause, findings, signature, selectedRowId, signedBy]
      properties:
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        total_km: { type: number }
        work_completed: { type: string }
        status: { type: string }
        root_cause: { type: string }
        findings: { type: string }
        selectedRowId: { type: string }
        signature: { type: string, description: Signature value recorded by the client. }
        signedBy: { type: string }
        contractor:
          type: array
          items: { $ref: "#/components/schemas/CostLine" }
        total_cost_contractor: { type: number, format: double }
        parts:
          type: array
          items: { $ref: "#/components/schemas/CostLine" }
        total_cost_parts: { type: number, format: double }
        sundries:
          type: array
          items: { $ref: "#/components/schemas/CostLine" }
        total_cost_sundries: { type: number, format: double }
        invoices:
          type: array
          items: { $ref: "#/components/schemas/UploadMetadata" }
        images:
          type: array
          items: { $ref: "#/components/schemas/UploadMetadata" }

    MaintenanceAction:
      allOf:
        - $ref: "#/components/schemas/MaintenanceActionCreate"
        - type: object
          additionalProperties: true
          properties:
            id: { type: string }
            created_at: { type: string, format: date-time }

    AssetFields:
      type: object
      properties:
        location: { type: string }
        business_unit: { type: string }
        area: { type: string }
        equipment: { type: string }
        assetType: { type: string }
        category: { type: string }
        replacementValue: { type: number, format: double }
        assetID: { type: string }
        condition: { type: string }
        serialNumber: { type: string }
        additional_notes: { type: string }
        images:
          type: array
          items: { $ref: "#/components/schemas/UploadMetadata" }

    AssetCreate:
      allOf:
        - $ref: "#/components/schemas/AssetFields"
        - type: object
          required: [location, business_unit, area, equipment, assetType, category, replacementValue, condition]
          description: assetID is optional for low-value and rental assets.

    AssetUpdate:
      allOf:
        - $ref: "#/components/schemas/AssetFields"
        - type: object
          properties:
            deleted_image_keys:
              type: array
              items: { type: string }

    Asset:
      allOf:
        - $ref: "#/components/schemas/AssetFields"
        - type: object
          additionalProperties: true
          properties:
            id: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            last_verified_at: { type: string, format: date-time }

    TransferAsset:
      type: object
      additionalProperties: true
      properties:
        assetID: { type: string }
        images:
          type: array
          items: { $ref: "#/components/schemas/UploadMetadata" }

    AssetTransferCreate:
      type: object
      required: [transferReason, locationFrom, locationTo, expectedDate, assets]
      properties:
        transferReason: { type: string }
        locationFrom: { type: string }
        locationTo: { type: string }
        expectedDate: { type: string, format: date }
        description: { type: string }
        assets:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/TransferAsset" }
        transportInvoices:
          type: array
          items: { $ref: "#/components/schemas/UploadMetadata" }

    AssetTransfer:
      allOf:
        - $ref: "#/components/schemas/AssetTransferCreate"
        - type: object
          additionalProperties: true
          properties:
            id: { type: string }
            status:
              type: string
              enum: [pending, approved, rejected, in-transit, completed, cancelled]
            created_at: { type: string, format: date-time }

    TransferInTransit:
      type: object
      required: [transportType, transportName, transportDate, status]
      properties:
        transportType: { type: string }
        transportName: { type: string }
        transportDate: { type: string }
        status: { type: string, enum: [in-transit] }
        trackingNumber: { type: string }
        transportCost: { type: number, format: double }
        transportNotes: { type: string }
        images:
          type: array
          items: { $ref: "#/components/schemas/UploadMetadata" }
        transportInvoices:
          type: array
          items: { $ref: "#/components/schemas/UploadMetadata" }

    TransferReceipt:
      type: object
      required: [condition, receiptDate, status]
      properties:
        condition: { type: string }
        receiptDate: { type: string }
        status: { type: string, enum: [receipt] }
        notes: { type: string }
        images:
          type: array
          items: { $ref: "#/components/schemas/UploadMetadata" }
        deliveryNote: { $ref: "#/components/schemas/UploadMetadata" }

    DisposalAsset:
      type: object
      additionalProperties: true
      properties:
        assetID: { type: string }
        area: { type: string }
        equipment: { type: string }
        images:
          type: array
          items: { $ref: "#/components/schemas/UploadMetadata" }
      description: Identified assets use assetID; unidentified assets use area and equipment.

    DisposalCreate:
      type: object
      required: [location, expectedDisposalDate, disposalReason, assets]
      properties:
        location: { type: string }
        expectedDisposalDate: { type: string, format: date }
        disposalReason: { type: string }
        description: { type: string }
        assets:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/DisposalAsset" }

    Disposal:
      allOf:
        - $ref: "#/components/schemas/DisposalCreate"
        - type: object
          additionalProperties: true
          properties:
            id: { type: string }
            status:
              type: string
              enum: [pending, approved, rejected, expired, cancelled, disposed]
            created_at: { type: string, format: date-time }

    DisposalCompletion:
      type: object
      required: [disposalMethod, disposalCost]
      properties:
        disposalMethod: { type: string }
        disposalCost: { type: number, format: double, minimum: 0 }
        notes: { type: string }
        images:
          type: array
          items: { $ref: "#/components/schemas/UploadMetadata" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/UploadMetadata" }

    UserCreate:
      type: object
      required: [email, group, family_name, name, location, mobile, position]
      properties:
        email: { type: string, format: email }
        group: { type: string }
        family_name: { type: string }
        name: { type: string }
        location: { type: string }
        mobile: { type: string }
        position: { type: string }

    UserUpdate:
      type: object
      properties:
        email: { type: string, format: email }
        name: { type: string }
        family_name: { type: string }
        group: { type: string }
        location: { type: string }
        mobile: { type: string }

    User:
      type: object
      additionalProperties: true
      properties:
        sub: { type: string, format: uuid }
        email: { type: string, format: email }
        group: { type: string }
        family_name: { type: string }
        name: { type: string }
        location: { type: string }
        mobile: { type: string }
        position: { type: string }
        enabled: { type: boolean }

    Contractor:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        business_unit: { type: string }
        area: { type: string }
        equipment: { type: string }
        location: { type: string }
        assetID: { type: string }
        serialNumber: { type: string }
        condition: { type: string }
        additional_notes: { type: string }
        createdAt: { type: string, format: date-time }

    ContractorCreate:
      type: object
      required: [business_unit, area, equipment, location, assetID, serialNumber, condition, additional_notes]
      properties:
        business_unit: { type: string }
        area: { type: string }
        equipment: { type: string }
        location: { type: string }
        assetID: { type: string }
        serialNumber: { type: string }
        condition: { type: string }
        additional_notes: { type: string }

    ContractorUpdate:
      type: object
      properties:
        description: { type: string }
        assetID: { type: string }
        condition: { type: string }
        location: { type: string }
        warranty: { type: string }
        warranty_expire: { type: string }
        date_of_manufacture: { type: string }
        serialNumber: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        status: { type: string }
        type: { type: string }
        equipment: { type: string }

    Comment:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        request_id: { type: string }
        comment: { type: string }
        created_at: { type: string, format: date-time }
        created_by_sub: { type: string }
        created_by_name: { type: string }

    Notification:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        recipientSub: { type: string }
        notificationCreated: { type: string, format: date-time }
        status: { type: string }
        message: { type: string }

    NotificationSummary:
      type: object
      additionalProperties: true
      properties:
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        counts:
          type: object
          additionalProperties:
            type: integer

    VerificationMetrics:
      type: object
      additionalProperties: true
      description: Aggregate asset-verification metrics for the authorized location scope.
      properties:
        location: { type: string, example: all sites }
        compliance: { type: number, format: double }
        total: { type: integer }
        statuses:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name:
                type: string
                enum: [Verified, Due, Overdue, Not Verified]
              value: { type: integer }
