openapi: 3.0.3
info:
  title: Atlantic Meat Maintenance and Asset Management API
  version: "2026-10-12"
  description: |
    API contract for the currently deployed maintenance and asset-management application.
    Unless stated otherwise, operations require a Cognito JWT access token.
servers:
  - url: https://crud-nosql.app.fabian-portfolio.net
    description: Production
security:
  - BearerAuth: []
tags:
  - name: Jobs
  - name: Assets
  - name: Transfers
  - name: Disposals
  - name: Users
  - name: Comments
  - name: Notifications
  - name: Dashboard

paths:
  /api/jobs/requests:
    get:
      tags: [Jobs]
      summary: List active maintenance requests
      operationId: getJobsList
      x-lambda-runtime: python3.12
      x-lambda-function: getJobsList
      x-database: crud-nosql-app-maintenance-request-table
      parameters:
        - $ref: "#/components/parameters/StatusQuery"
      responses:
        "200":
          description: Maintenance requests visible to the caller
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MaintenanceRequest" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Jobs]
      summary: Create a maintenance request
      operationId: postJobRequest
      x-lambda-runtime: python3.12
      x-lambda-function: postJobRequest
      x-database: crud-nosql-app-maintenance-request-table
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenanceRequestCreate" }
      responses:
        "201":
          description: Request created; presigned URLs are returned for declared images
          content:
            application/json:
              schema:
                type: object
                required: [data, presigned_urls]
                properties:
                  data: { $ref: "#/components/schemas/MaintenanceRequest" }
                  presigned_urls:
                    type: array
                    items: { $ref: "#/components/schemas/PresignedUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/jobs/completed:
    get:
      tags: [Jobs]
      summary: List completed maintenance jobs visible to the caller
      operationId: getJobsCompletedList
      x-lambda-runtime: python3.12
      x-lambda-function: getJobsCompletedList
      x-database: crud-nosql-app-maintenance-request-table
      x-database-1: crud-nosql-app-maintenance-action-table
      responses:
        "200":
          description: Completed jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MaintenanceAction" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Jobs]
      summary: Get a maintenance request
      operationId: getJobById
      x-lambda-runtime: python3.12
      x-lambda-function: getJobById
      x-database: crud-nosql-app-maintenance-request-table
      responses:
        "200":
          description: Maintenance request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [Jobs]
      summary: Update a maintenance request
      operationId: updateJobById
      x-lambda-runtime: python3.12
      x-lambda-function: updateJobById
      x-database: crud-nosql-app-maintenance-request-table
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreeformObject" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Jobs]
      summary: Delete a maintenance request
      operationId: deleteJobById
      x-lambda-runtime: python3.12
      x-lambda-function: deleteJobById
      x-database: crud-nosql-app-maintenance-request-table
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/jobs/{id}/approve:
    post:
      tags: [Jobs]
      summary: Approve and assign a maintenance request
      operationId: postApproveRequest
      x-lambda-runtime: python3.12
      x-lambda-function: postApproveRequest
      x-database: crud-nosql-app-maintenance-request-table
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobApproval" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/jobs/{id}/reject:
    post:
      tags: [Jobs]
      summary: Reject a maintenance request
      operationId: postRejectRequest
      x-lambda-runtime: python3.12
      x-lambda-function: postRejectRequest
      x-database: crud-nosql-app-maintenance-request-table
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobRejection" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/jobs/{id}/action:
    post:
      tags: [Jobs]
      summary: Record maintenance work and complete a job
      operationId: postJobAction
      x-lambda-runtime: python3.12
      x-lambda-function: postJobAction
      x-database: crud-nosql-app-maintenance-action-table
      x-database-1: crud-nosql-app-maintenance-request-table
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenanceActionCreate" }
      responses:
        "201":
          description: Action recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/MaintenanceAction" }
                  presigned_urls:
                    type: array
                    items: { $ref: "#/components/schemas/PresignedUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/jobs/{id}/jobcard:
    get:
      tags: [Jobs]
      summary: Get a presigned PDF jobcard URL
      description: The path ID is the maintenance action ID used to locate the generated jobcard.
      operationId: getJobcardById
      x-lambda-runtime: python3.12
      x-lambda-function: getJobcardById
      x-database: crud-nosql-app-maintenance-request-table
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Presigned URL for the PDF
          content:
            application/json:
              schema:
                type: object
                required: [jobcard_url]
                properties:
                  jobcard_url: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/assets:
    get:
      tags: [Assets]
      summary: List assets visible to the caller
      operationId: getAssetsList
      x-lambda-runtime: python3.12
      x-lambda-function: getAssetsList
      x-database: crud-nosql-app-assets-table
      responses:
        "200":
          description: Assets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Asset" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Assets]
      summary: Create an asset
      operationId: postCreateAsset
      x-lambda-runtime: python3.12
      x-lambda-function: postCreateAsset
      x-database: crud-nosql-app-assets-table
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetCreate" }
      responses:
        "201":
          description: Asset created
          content:
            application/json:
              schema:
                type: object
                properties:
                  presigned_urls:
                    type: array
                    items: { $ref: "#/components/schemas/PresignedUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/assets/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Assets]
      summary: Get an asset
      operationId: getAssetById
      x-lambda-runtime: python3.12
      x-lambda-function: getAssetById
      x-database: crud-nosql-app-assets-table
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [Assets]
      summary: Update an asset
      operationId: updateAssetById
      x-lambda-runtime: python3.12
      x-lambda-function: updateAssetById
      x-database: crud-nosql-app-assets-table
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetUpdate" }
      responses:
        "200":
          description: Asset updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  presigned_urls:
                    type: array
                    items: { $ref: "#/components/schemas/PresignedUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Assets]
      summary: Delete an asset
      operationId: deleteAssetById
      x-lambda-runtime: python3.12
      x-lambda-function: deleteAssetById
      x-database: crud-nosql-app-assets-table
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/assets/location:
    get:
      tags: [Assets]
      summary: List assets for a location
      operationId: getAssetsByLocation
      x-lambda-runtime: python3.12
      x-lambda-function: getAssetsByLocation
      x-database: crud-nosql-app-assets-table
      parameters:
        - $ref: "#/components/parameters/LocationQuery"
      responses:
        "200":
          description: Assets in the location
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Asset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/assets/options:
    get:
      tags: [Assets]
      summary: Get assets formatted as maintenance-request options
      operationId: getJobsRequestAssetOptions
      x-lambda-runtime: python3.12
      x-lambda-function: getJobsRequestAssetOptions
      x-database: crud-nosql-app-assets-table
      parameters:
        - $ref: "#/components/parameters/LocationQuery"
      responses:
        "200":
          description: Asset options
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FreeformObject" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/assets/{id}/history:
    get:
      tags: [Assets]
      summary: Get an asset's maintenance history
      operationId: getAssetHistory
      x-lambda-runtime: python3.12
      x-lambda-function: getAssetHistory
      x-database: crud-nosql-app-maintenance-request-table
      x-database-1: crud-nosql-app-maintenance-action-table
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Asset history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FreeformObject" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/assets/{id}/verify:
    post:
      tags: [Assets]
      summary: Record an asset verification
      operationId: postAssetVerify
      x-lambda-runtime: python3.12
      x-lambda-function: postAssetVerify
      x-database: crud-nosql-app-assets-table
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number, format: double, example: -33.9249 }
                longitude: { type: number, format: double, example: 18.4241 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/transfers/requests:
    get:
      tags: [Transfers]
      summary: List active asset-transfer requests
      operationId: getTransferList
      x-lambda-runtime: python3.12
      x-lambda-function: getTransferList
      x-database: crud-nosql-app-assets-transfer-table
      parameters:
        - $ref: "#/components/parameters/StatusQuery"
      responses:
        "200":
          description: Transfer requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssetTransfer" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Transfers]
      summary: Create an asset-transfer request
      operationId: postTransferRequest
      x-lambda-runtime: python3.12
      x-lambda-function: postTransferRequest
      x-database: crud-nosql-app-assets-transfer-table
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetTransferCreate" }
      responses:
        "201":
          description: Transfer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AssetTransfer" }
                  presigned_urls:
                    type: array
                    items: { $ref: "#/components/schemas/PresignedUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/transfers/completed:
    get:
      tags: [Transfers]
      summary: List completed transfers
      operationId: getTransferCompletedList
      x-lambda-runtime: python3.12
      x-lambda-function: getTransferCompletedList
      x-database: crud-nosql-app-assets-transfer-table
      responses:
        "200":
          description: Completed transfers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssetTransfer" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/transfers/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Transfers]
      summary: Get a transfer
      operationId: getTransferById
      x-lambda-runtime: python3.12
      x-lambda-function: getTransferById
      x-database: crud-nosql-app-assets-transfer-table
      responses:
        "200":
          description: Transfer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetTransfer" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [Transfers]
      summary: Update a transfer
      description: The current Lambda is a placeholder and returns a success string.
      operationId: updateTransferById
      x-lambda-runtime: python3.12
      x-lambda-function: updateTransferById
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreeformObject" }
      responses:
        "200":
          description: Placeholder success response
          content:
            application/json:
              schema: { type: string, example: "Success: updateTransferById" }
    delete:
      tags: [Transfers]
      summary: Delete a transfer
      operationId: deleteTransferById
      x-lambda-runtime: python3.12
      x-lambda-function: deleteTransferById
      x-database: crud-nosql-app-assets-transfer-table
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/transfers/{id}/approve:
    post:
      tags: [Transfers]
      summary: Approve a transfer
      operationId: postTransferApproval
      x-lambda-runtime: python3.12
      x-lambda-function: postTransferApproval
      x-database: crud-nosql-app-assets-transfer-table
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, status]
              properties:
                id: { type: string }
                status: { type: string, enum: [approved] }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/transfers/{id}/reject:
    post:
      tags: [Transfers]
      summary: Reject a transfer
      operationId: postTransferReject
      x-lambda-runtime: python3.12
      x-lambda-function: postTransferReject
      x-database: crud-nosql-app-assets-transfer-table
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, status, reason]
              properties:
                id: { type: string }
                status: { type: string, enum: [rejected] }
                reason: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/transfers/{id}/in-transit:
    post:
      tags: [Transfers]
      summary: Mark a transfer in transit
      operationId: postTransferTransit
      x-lambda-runtime: python3.12
      x-lambda-function: postTransferTransit
      x-database: crud-nosql-app-assets-transfer-table
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferInTransit" }
      responses:
        "200":
          description: Transfer updated and upload URLs created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  presigned_urls:
                    type: array
                    items: { $ref: "#/components/schemas/PresignedUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/transfers/{id}/receipt:
    post:
      tags: [Transfers]
      summary: Record receipt of a transfer
      operationId: postTransferReceipt
      x-lambda-runtime: python3.12
      x-lambda-function: postTransferReceipt
      x-database: crud-nosql-app-assets-transfer-table
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferReceipt" }
      responses:
        "200":
          description: Receipt recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  uploadUrls:
                    type: object
                    properties:
                      images:
                        type: array
                        items: { $ref: "#/components/schemas/PresignedUpload" }
                      deliveryNote: { $ref: "#/components/schemas/PresignedUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/transfers/{id}/transfer-document:
    get:
      tags: [Transfers]
      summary: Get the transfer document response
      description: The current implementation uses jobcard lookup logic and returns a jobcard_url property.
      operationId: getTransferDocumentById
      x-lambda-runtime: python3.12
      x-lambda-function: getTransferDocumentById
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Current document response
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobcard_url: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/disposals/requests:
    get:
      tags: [Disposals]
      summary: List active disposal requests
      operationId: getDisposalList
      x-lambda-runtime: python3.12
      x-lambda-function: getDisposalList
      x-database: crud-nosql-app-assets-disposal-table
      parameters:
        - $ref: "#/components/parameters/StatusQuery"
      responses:
        "200":
          description: Disposal requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Disposal" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Disposals]
      summary: Create a disposal request
      operationId: postDisposalRequest
      x-lambda-runtime: python3.12
      x-lambda-function: postDisposalRequest
      x-database: crud-nosql-app-assets-disposal-table
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisposalCreate" }
      responses:
        "201":
          description: Disposal request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Disposal" }
                  presigned_urls:
                    type: array
                    items: { $ref: "#/components/schemas/PresignedUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/disposals/completed:
    get:
      tags: [Disposals]
      summary: List completed disposals
      operationId: getDisposalCompletedList
      x-lambda-runtime: python3.12
      x-lambda-function: getDisposalCompletedList
      x-database: crud-nosql-app-assets-disposal-table
      responses:
        "200":
          description: Completed disposals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Disposal" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/disposals/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Disposals]
      summary: Get a disposal request
      operationId: getDisposalById
      x-lambda-runtime: python3.12
      x-lambda-function: getDisposalById
      x-database: crud-nosql-app-assets-disposal-table
      responses:
        "200":
          description: Disposal request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Disposal" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [Disposals]
      summary: Update a disposal request
      description: The current Lambda is a placeholder and returns a success string.
      operationId: updateDisposalById
      x-lambda-runtime: python3.12
      x-lambda-function: updateDisposalById
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreeformObject" }
      responses:
        "200":
          description: Placeholder success response
          content:
            application/json:
              schema: { type: string, example: "Success: updateDisposalById" }
    delete:
      tags: [Disposals]
      summary: Delete a disposal request
      operationId: deleteDisposalById
